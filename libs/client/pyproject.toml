[project]
name = "podcastify-client"
version = "0.1.0"
description = "Official Python SDK and CLI for Thinking in Code (Podcastify) API."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "podcastify-contracts>=0.1.0",
]
keywords = [
    "podcast",
    "client",
    "sdk",
    "cli",
    "api",
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
tic = "podcastify_client.cli:main"

[project.urls]
Repository = "https://github.com/KOKUTBON/xCAST"
Documentation = "https://github.com/KOKUTBON/xCAST/blob/main/README.md"
Source = "https://github.com/KOKUTBON/xCAST/tree/main/libs/client"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
