[project]
name = "podcastify-podcast"
version = "0.1.0"
description = "Podcast generation engine (clean architecture)."
requires-python = ">=3.11"
keywords = [
  "ai",
  "podcast-generator",
  "pdf-to-podcast",
  "text-to-speech",
  "speech-synthesis",
  "rag",
  "ollama",
]
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "rich>=13.7",
  "podcastify-contracts>=0.1.0",
  "pdfplumber>=0.11",
  "pytesseract>=0.3",
  "pyttsx3>=2.90",
  "pydub>=0.25",
  "pymupdf>=1.24",
  "rank-bm25>=0.2.2",
  "pyloudnorm>=0.1.1",
]

[project.urls]
Repository = "https://github.com/KOKUTBON/xCAST"
Documentation = "https://github.com/KOKUTBON/xCAST/blob/main/README.md"
Source = "https://github.com/KOKUTBON/xCAST/tree/main/libs/podcast"

[project.optional-dependencies]
audio-output = [
  "soundfile>=0.13",
]
storage-s3 = [
  "boto3>=1.28",
]


[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
