name: Static demo — build or publish manually

on:
  pull_request:
    paths:
      - 'services/api/static/**'
      - 'assets/branding/**'
      - 'demo/**'
      - 'scripts/build_demo.py'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the demo to GitHub Pages'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test browser-only transport
        run: node --test demo/tests/runtime.test.mjs
      - name: Extract static UI
        run: python scripts/build_demo.py
      - name: Check JavaScript syntax
        run: |
          node --check dist/pages/app.js
          node --check dist/pages/demo-runtime.js
      - name: Package Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist/pages

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
